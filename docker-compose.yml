# AI Invincible Office — container stack
#
#   docker compose up -d          # this office only
#   docker compose logs -f office # follow the log
#
# Scheduling, Telegram and the morning brief are all built into the app now,
# so no n8n container is needed. (n8n was removed in v2.2 — it was never
# referenced by the code and duplicated the built-in scheduler.)
#
# Ollama is expected on the HOST (simplest, and it can use your GPU):
#   https://ollama.com/download  →  ollama pull llama3.2
#
# Linux/Windows: host.docker.internal is mapped with extra_hosts below.

services:
  office:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-office-app
    restart: unless-stopped
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - DATA_DIR=/data
      - SEED_DEMO=${SEED_DEMO:-true}
      - OFFICE_TIMEZONE=${OFFICE_TIMEZONE:-Asia/Kolkata}
      - AI_PROVIDER=${AI_PROVIDER:-auto}
      # Inside Docker, reach Ollama on the host through this name:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - MAX_MODEL_CALLS_PER_DAY=${MAX_MODEL_CALLS_PER_DAY:-200}
      - ALLOWED_USER_IDS=${ALLOWED_USER_IDS:-owner}
      # Set this if the port is reachable from anywhere but your own machine.
      - OFFICE_ACCESS_CODE=${OFFICE_ACCESS_CODE:-}
      # Telegram is optional: it only ever talks to YOUR chat id.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_OWNER_CHAT_ID=${TELEGRAM_OWNER_CHAT_ID:-}
      - ALLOWED_TELEGRAM_USER_IDS=${ALLOWED_TELEGRAM_USER_IDS:-owner}
      - TELEGRAM_MODE=${TELEGRAM_MODE:-off}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      # Built-in daily brief + follow-up queue (replaces the n8n cron).
      - SCHEDULER=${SCHEDULER:-on}
      - SCHEDULER_HOUR=${SCHEDULER_HOUR:-9}
      - SCHEDULER_MINUTE=${SCHEDULER_MINUTE:-0}
    volumes:
      # Your database lives here. Back it up: npm run backup
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
